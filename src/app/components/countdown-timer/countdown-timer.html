<section class="countdown-section" appScrollReveal>
  <div class="countdown-container">
    <div class="countdown-ornament-top">
      <span class="ornament-line"></span>
      <span class="ornament-icon">
        <svg
          viewBox="0 0 48 20"
          width="44"
          height="18"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <!-- 8-Pointed Royal Gold Star -->
          <path
            d="M24 2 L25.6 7.2 L31 5.8 L28 10 L31 14.2 L25.6 12.8 L24 18 L22.4 12.8 L17 14.2 L20 10 L17 5.8 L22.4 7.2 Z"
            fill="#C9922B"
          />
          <circle cx="24" cy="10" r="1.5" fill="#FFFDF8" />
          <!-- Flanking Luxury Pearls -->
          <circle cx="8" cy="10" r="2" fill="#C9922B" opacity="0.6" />
          <circle cx="40" cy="10" r="2" fill="#C9922B" opacity="0.6" />
          <circle cx="1" cy="10" r="1" fill="#C9922B" opacity="0.3" />
          <circle cx="47" cy="10" r="1" fill="#C9922B" opacity="0.3" />
        </svg>
      </span>
      <span class="ornament-line"></span>
    </div>

    <p class="countdown-eyebrow">العد التنازلي لليلة العمر</p>

    <!-- Luxury Seamless Countdown Strip -->
    <div class="countdown-strip">
      <!-- Days -->
      <div class="countdown-unit" #digitBox>
        <strong class="countdown-num">{{ formatNum(countdown().days) }}</strong>
        <span class="countdown-tag">يوم</span>
      </div>

      <span class="countdown-sep">:</span>

      <!-- Hours -->
      <div class="countdown-unit" #digitBox>
        <strong class="countdown-num">{{ formatNum(countdown().hours) }}</strong>
        <span class="countdown-tag">ساعة</span>
      </div>

      <span class="countdown-sep">:</span>

      <!-- Minutes -->
      <div class="countdown-unit" #digitBox>
        <strong class="countdown-num">{{ formatNum(countdown().minutes) }}</strong>
        <span class="countdown-tag">دقيقة</span>
      </div>

      <span class="countdown-sep">:</span>

      <!-- Seconds -->
      <div class="countdown-unit" #digitBox>
        <strong class="countdown-num">{{ formatNum(countdown().seconds) }}</strong>
        <span class="countdown-tag">ثانية</span>
      </div>
    </div>
  </div>
</section>

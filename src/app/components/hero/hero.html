<section class="hero-section">
  <!-- Royal Dusty-Blue & Gold Botanical Card Container -->
  <div class="botanical-card-wrapper" appScrollReveal>
    <!-- Botanical Corner Art (4 Corners - 100% Clean, zero ghost text) -->
    <img
      src="images/botanical_tl_trans.png"
      alt=""
      class="botanical-corner corner-tl"
      aria-hidden="true"
    />
    <img
      src="images/botanical_tr_trans.png"
      alt=""
      class="botanical-corner corner-tr"
      aria-hidden="true"
    />
    <img
      src="images/botanical_bl_trans.png"
      alt=""
      class="botanical-corner corner-bl"
      aria-hidden="true"
    />
    <img
      src="images/botanical_br_trans.png"
      alt=""
      class="botanical-corner corner-br"
      aria-hidden="true"
    />

    <!-- Outer Double Hairline Gold Arch Frame -->
    <div class="card-arch-outer">
      <div class="card-arch-inner">
        <!-- 1. Gold Calligraphic Basmala -->
        <div class="card-basmala-wrap" appScrollReveal [revealDelay]="0.1">
          <h2 class="gold-calligraphy-basmala">{{ config.bismillah }}</h2>
        </div>

        <!-- 2. Delicate Heart Divider -->
        <div class="gold-heart-divider" appScrollReveal [revealDelay]="0.15">
          <span class="divider-line"></span>
          <svg class="gold-heart-svg" viewBox="0 0 16 14" width="14" height="12" fill="none">
            <path
              d="M8 12.5 C7.2 11.7 1.5 7.8 1.5 4.2 C1.5 2.2 3.1 0.8 5 0.8 C6.2 0.8 7.3 1.5 8 2.4 C8.7 1.5 9.8 0.8 11 0.8 C12.9 0.8 14.5 2.2 14.5 4.2 C14.5 7.8 8.8 11.7 8 12.5 Z"
              stroke="#c8963e"
              stroke-width="1.2"
            />
          </svg>
          <span class="divider-line"></span>
        </div>

        <!-- 3. Greeting 1: فرحنا هيكمل بيكم -->
        <div class="card-greeting-block" appScrollReveal [revealDelay]="0.2">
          <!-- Left Gold Laurel Sprig -->
          <svg
            class="gold-laurel-sprig sprig-left"
            viewBox="0 0 28 14"
            width="24"
            height="12"
            fill="none"
          >
            <path
              d="M26 12 C18 10 10 7 2 2"
              stroke="#c8963e"
              stroke-width="1.2"
              stroke-linecap="round"
            />
            <path d="M12 8 C9 6 8 3 10 1 C12 3 13 6 12 8 Z" fill="#d8a858" opacity="0.85" />
            <path d="M19 9 C17 7 16 4 18 2 C20 4 21 7 19 9 Z" fill="#d8a858" opacity="0.85" />
          </svg>

          <h3 class="card-phrase-primary">فرحنا هيكمل بيكم</h3>

          <!-- Right Gold Laurel Sprig -->
          <svg
            class="gold-laurel-sprig sprig-right"
            viewBox="0 0 28 14"
            width="24"
            height="12"
            fill="none"
          >
            <path
              d="M2 12 C10 10 18 7 26 2"
              stroke="#c8963e"
              stroke-width="1.2"
              stroke-linecap="round"
            />
            <path d="M16 8 C19 6 20 3 18 1 C16 3 15 6 16 8 Z" fill="#d8a858" opacity="0.85" />
            <path d="M9 9 C11 7 12 4 10 2 C8 4 7 7 9 9 Z" fill="#d8a858" opacity="0.85" />
          </svg>
        </div>

        <!-- 4. Delicate Heart Divider -->
        <div class="gold-heart-divider" appScrollReveal [revealDelay]="0.25">
          <span class="divider-line"></span>
          <svg class="gold-heart-svg" viewBox="0 0 16 14" width="14" height="12" fill="none">
            <path
              d="M8 12.5 C7.2 11.7 1.5 7.8 1.5 4.2 C1.5 2.2 3.1 0.8 5 0.8 C6.2 0.8 7.3 1.5 8 2.4 C8.7 1.5 9.8 0.8 11 0.8 C12.9 0.8 14.5 2.2 14.5 4.2 C14.5 7.8 8.8 11.7 8 12.5 Z"
              stroke="#c8963e"
              stroke-width="1.2"
            />
          </svg>
          <span class="divider-line"></span>
        </div>

        <!-- 5. Centerpiece: مصطفى & أروى in 3D Gold Calligraphy -->
        <div class="card-names-wrap" appScrollReveal [revealDelay]="0.3">
          <h1 class="card-names-gold">
            <span class="name-text">{{ config.groomName }}</span>
            <span class="gold-ampersand">&</span>
            <span class="name-text">{{ config.brideName }}</span>
          </h1>
        </div>

        <!-- 6. Royal Filigree Divider -->
        <div class="royal-filigree-divider" appScrollReveal [revealDelay]="0.35">
          <svg
            class="filigree-flourish-svg"
            viewBox="0 0 110 18"
            width="95"
            height="16"
            fill="none"
          >
            <!-- Left Flourish -->
            <path
              d="M45 9 C35 9 30 3 20 4 C12 5 8 12 2 12"
              stroke="#c8963e"
              stroke-width="1.2"
              stroke-linecap="round"
            />
            <circle cx="2" cy="12" r="1.5" fill="#c8963e" />
            <!-- Center Heart -->
            <path
              d="M55 14 C54.3 13.3 49.5 10 49.5 7 C49.5 5.3 50.8 4 52.4 4 C53.4 4 54.3 4.6 55 5.4 C55.7 4.6 56.6 4 57.6 4 C59.2 4 60.5 5.3 60.5 7 C60.5 10 55.7 13.3 55 14 Z"
              fill="#c8963e"
            />
            <!-- Right Flourish -->
            <path
              d="M65 9 C75 9 80 3 90 4 C98 5 102 12 108 12"
              stroke="#c8963e"
              stroke-width="1.2"
              stroke-linecap="round"
            />
            <circle cx="108" cy="12" r="1.5" fill="#c8963e" />
          </svg>
        </div>

        <!-- 7. Greeting 2: مستنينكم تنورونا -->
        <div class="card-greeting-sub" appScrollReveal [revealDelay]="0.4">
          <p class="card-phrase-secondary">مستنينكم تنورونا</p>
          <div class="gold-heart-divider mini-divider">
            <span class="divider-line"></span>
            <svg class="gold-heart-svg" viewBox="0 0 16 14" width="12" height="10" fill="none">
              <path
                d="M8 12.5 C7.2 11.7 1.5 7.8 1.5 4.2 C1.5 2.2 3.1 0.8 5 0.8 C6.2 0.8 7.3 1.5 8 2.4 C8.7 1.5 9.8 0.8 11 0.8 C12.9 0.8 14.5 2.2 14.5 4.2 C14.5 7.8 8.8 11.7 8 12.5 Z"
                stroke="#c8963e"
                stroke-width="1.2"
              />
            </svg>
            <span class="divider-line"></span>
          </div>
        </div>

        <!-- 8. Event Details 3-Pill Trio Grid with Premium Gold SVG Icons -->
        <div class="card-details-trio" appScrollReveal [revealDelay]="0.45">
          <!-- Item 1: Date -->
          <div class="trio-item">
            <div class="trio-icon">
              <!-- Premium Calendar Icon with Heart -->
              <svg viewBox="0 0 32 32" width="28" height="28" fill="none">
                <rect
                  x="4"
                  y="6"
                  width="24"
                  height="22"
                  rx="5"
                  stroke="#c8963e"
                  stroke-width="1.6"
                />
                <line x1="4" y1="13" x2="28" y2="13" stroke="#c8963e" stroke-width="1.4" />
                <line
                  x1="10"
                  y1="3"
                  x2="10"
                  y2="8"
                  stroke="#c8963e"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
                <line
                  x1="22"
                  y1="3"
                  x2="22"
                  y2="8"
                  stroke="#c8963e"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
                <!-- Center Heart -->
                <path
                  d="M16 23 C15.4 22.4 11.5 19.5 11.5 17 C11.5 15.5 12.7 14.3 14.1 14.3 C15 14.3 15.7 14.8 16 15.5 C16.3 14.8 17 14.3 17.9 14.3 C19.3 14.3 20.5 15.5 20.5 17 C20.5 19.5 16.6 22.4 16 23 Z"
                  stroke="#c8963e"
                  stroke-width="1.2"
                />
              </svg>
            </div>
            <p class="trio-val">02/10/2026</p>
            <div class="trio-sub-divider">
              <span class="sub-dash"></span>
              <svg viewBox="0 0 10 8" width="8" height="7" fill="none">
                <path
                  d="M5 7 C4.6 6.5 1 4 1 2.2 C1 1.2 1.8 0.5 2.8 0.5 C3.4 0.5 4.1 0.9 5 1.5 C5.9 0.9 6.6 0.5 7.2 0.5 C8.2 0.5 9 1.2 9 2.2 C9 4 5.4 6.5 5 7 Z"
                  stroke="#c8963e"
                  stroke-width="0.9"
                />
              </svg>
              <span class="sub-dash"></span>
            </div>
          </div>

          <div class="trio-separator"></div>

          <!-- Item 2: Time -->
          <div class="trio-item">
            <div class="trio-icon">
              <!-- Premium Clock Icon -->
              <svg viewBox="0 0 32 32" width="28" height="28" fill="none">
                <circle cx="16" cy="16" r="12" stroke="#c8963e" stroke-width="1.6" />
                <polyline
                  points="16 9 16 16 21 18.5"
                  stroke="#c8963e"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <circle cx="16" cy="16" r="1.5" fill="#c8963e" />
              </svg>
            </div>
            <p class="trio-val">07:30 PM</p>
            <div class="trio-sub-divider">
              <span class="sub-dash"></span>
              <svg viewBox="0 0 10 8" width="8" height="7" fill="none">
                <path
                  d="M5 7 C4.6 6.5 1 4 1 2.2 C1 1.2 1.8 0.5 2.8 0.5 C3.4 0.5 4.1 0.9 5 1.5 C5.9 0.9 6.6 0.5 7.2 0.5 C8.2 0.5 9 1.2 9 2.2 C9 4 5.4 6.5 5 7 Z"
                  stroke="#c8963e"
                  stroke-width="0.9"
                />
              </svg>
              <span class="sub-dash"></span>
            </div>
          </div>

          <div class="trio-separator"></div>

          <!-- Item 3: Location -->
          <div class="trio-item">
            <div class="trio-icon">
              <!-- Premium Map Pin Icon with Heart -->
              <svg viewBox="0 0 32 32" width="28" height="28" fill="none">
                <path
                  d="M16 28 C21.5 21.5 26 17 26 12 A10 10 0 0 0 6 12 C6 17 10.5 21.5 16 28 Z"
                  stroke="#c8963e"
                  stroke-width="1.6"
                />
                <!-- Small Inner Heart -->
                <path
                  d="M16 15 C15.5 14.5 13 12.7 13 11 C13 9.9 13.9 9 14.9 9 C15.5 9 16 9.4 16 9.8 C16 9.4 16.5 9 17.1 9 C18.1 9 19 9.9 19 11 C19 12.7 16.5 14.5 16 15 Z"
                  stroke="#c8963e"
                  stroke-width="1.1"
                />
              </svg>
            </div>
            <p class="trio-val venue-title">Solitaire View Hall</p>
            <p class="trio-subval">Corniche El Maadi</p>
            <div class="trio-sub-divider">
              <span class="sub-dash"></span>
              <svg viewBox="0 0 10 8" width="8" height="7" fill="none">
                <path
                  d="M5 7 C4.6 6.5 1 4 1 2.2 C1 1.2 1.8 0.5 2.8 0.5 C3.4 0.5 4.1 0.9 5 1.5 C5.9 0.9 6.6 0.5 7.2 0.5 C8.2 0.5 9 1.2 9 2.2 C9 4 5.4 6.5 5 7 Z"
                  stroke="#c8963e"
                  stroke-width="0.9"
                />
              </svg>
              <span class="sub-dash"></span>
            </div>
          </div>
        </div>

        <!-- 9. QR Code Location Showcase -->
        <div class="card-qr-section" appScrollReveal [revealDelay]="0.5">
          <div class="qr-frame-gold">
            <img src="location.jpeg" alt="QR Code اللوكيشن" class="qr-image" />
            <div class="qr-pin-badge">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="#c8963e">
                <path
                  d="M12 2 C8.13 2 5 5.13 5 9 C5 14.25 12 22 12 22 C12 22 19 14.25 19 9 C19 5.13 15.87 2 12 2 Z M12 11.5 C10.62 11.5 9.5 10.38 9.5 9 C9.5 7.62 10.62 6.5 12 6.5 C13.38 6.5 14.5 7.62 14.5 9 C14.5 10.38 13.38 11.5 12 11.5 Z"
                />
              </svg>
            </div>
          </div>

          <!-- Premium Gold Laurel Label -->
          <div class="qr-scan-label-wrapper">
            <svg
              class="gold-laurel-mini sprig-left"
              viewBox="0 0 22 12"
              width="18"
              height="10"
              fill="none"
            >
              <path
                d="M20 10 C14 8 8 5 2 2"
                stroke="#c8963e"
                stroke-width="1.2"
                stroke-linecap="round"
              />
              <path d="M10 7 C8 5 7 3 9 1 C10 2 11 5 10 7 Z" fill="#d8a858" />
            </svg>
            <span class="qr-scan-text">SCAN FOR LOCATION</span>
            <svg
              class="gold-laurel-mini sprig-right"
              viewBox="0 0 22 12"
              width="18"
              height="10"
              fill="none"
            >
              <path
                d="M2 10 C8 8 14 5 20 2"
                stroke="#c8963e"
                stroke-width="1.2"
                stroke-linecap="round"
              />
              <path d="M12 7 C14 5 15 3 13 1 C12 2 11 5 12 7 Z" fill="#d8a858" />
            </svg>
          </div>

          <div class="gold-heart-divider">
            <span class="divider-line"></span>
            <svg class="gold-heart-svg" viewBox="0 0 16 14" width="14" height="12" fill="none">
              <path
                d="M8 12.5 C7.2 11.7 1.5 7.8 1.5 4.2 C1.5 2.2 3.1 0.8 5 0.8 C6.2 0.8 7.3 1.5 8 2.4 C8.7 1.5 9.8 0.8 11 0.8 C12.9 0.8 14.5 2.2 14.5 4.2 C14.5 7.8 8.8 11.7 8 12.5 Z"
                stroke="#c8963e"
                stroke-width="1.2"
              />
            </svg>
            <span class="divider-line"></span>
          </div>

          <!-- Direct Location Actions -->
          <div class="location-actions-row">
            <a
              [href]="config.locationUrl"
              target="_blank"
              rel="noopener noreferrer"
              class="btn-maps-action"
            >
              <svg
                viewBox="0 0 24 24"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                <polyline points="15 3 21 3 21 9" />
                <line x1="10" y1="14" x2="21" y2="3" />
              </svg>
              <span>فتح في Google Maps</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

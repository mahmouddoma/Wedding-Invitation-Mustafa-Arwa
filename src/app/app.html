<!-- Intro Door (full-screen overlay — hides when opened) -->
<app-intro-door (doorOpened)="onDoorOpened()" />

<!-- Main Wedding Content (visible after door opens) -->
<main class="wedding-content" [class.visible]="doorOpen()">
  <!-- Royal Arched Invitation Card -->
  <app-hero />

  <!-- Refined Luxury Countdown Strip -->
  <app-countdown-timer />

  <!-- Professional Venue & Maps Showcase -->
  <app-location-section />

  <!-- Add to Calendar -->
  <app-add-to-calendar />

  <!-- Social Sharing -->
  <app-share-section />

  <!-- Closing Blessing & Designer Portfolio Footer -->
  <app-closing-section />
</main>

<!-- Toast Notification -->
@if (shareService.toastMessage()) {
  <div class="toast show">{{ shareService.toastMessage() }}</div>
}

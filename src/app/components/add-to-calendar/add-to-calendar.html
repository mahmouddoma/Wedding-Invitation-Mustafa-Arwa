<section class="calendar-section" appScrollReveal>
  <div class="calendar-container">
    <div class="calendar-card">
      <div class="calendar-copy">
        <span class="calendar-eyebrow">لا تنسوا الموعد</span>
        <h3 class="calendar-title">أضيفوا ليلة الفرح إلى التقويم</h3>
      </div>

      <button
        class="calendar-action-btn"
        (click)="downloadCalendar()"
        aria-label="إضافة إلى التقويم"
      >
        <span>إضافة إلى التقويم</span>
        <span class="btn-icon">＋</span>
      </button>
    </div>
  </div>
</section>
